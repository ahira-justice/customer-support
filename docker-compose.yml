version: "3.4"

services:
  customer-support:
    image: ${DOCKER_REGISTRY-}customer-support:latest
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - .dockerenv
    expose:
      - "80"
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - customer-support
    ports:
      - "32620:32620"
